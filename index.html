<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trafalgar TV — Connexion</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #050816;
  --txt: #eef4ff;
  --muted: #9db0d6;
  --ok: #78efb0;
  --err: #ff8b9a;
  --warn: #ffd56b;
  --a: #67e7ff;
  --b: #5d7cff;
  font-family: 'Syne', system-ui, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(180deg, #071024, #050816);
  color: var(--txt);
}
.wrap {
  min-height: 100vh;
  padding: 20px;
  display: grid;
  place-items: center;
}
.card {
  width: min(620px, 100%);
  background: rgba(255,255,255,.04);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 24px;
  box-shadow: 0 20px 80px rgba(0,0,0,.35);
  padding: 28px;
}
.eyebrow {
  color: var(--warn);
  text-transform: uppercase;
  letter-spacing: .12em;
  font-weight: 800;
  font-size: .78rem;
}
.title {
  font-size: 1.9rem;
  line-height: 1.05;
  margin: .35rem 0 .5rem;
}
.sub {
  color: var(--muted);
  font-family: 'JetBrains Mono', monospace;
  font-size: .8rem;
  line-height: 1.6;
}
.field {
  display: flex;
  flex-direction: column;
  gap: 7px;
  margin-top: 14px;
}
label {
  font-weight: 700;
  font-size: .78rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .08em;
}
input, button { font: inherit; }
input {
  padding: 13px 16px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,.09);
  background: rgba(255,255,255,.05);
  color: var(--txt);
  font-family: 'JetBrains Mono', monospace;
  font-size: .9rem;
  width: 100%;
  transition: border-color .2s;
}
input:focus { outline: none; border-color: var(--a); }
button {
  padding: 17px;
  border: none;
  border-radius: 14px;
  font-weight: 900;
  cursor: pointer;
  width: 100%;
  margin-top: 20px;
  font-family: 'Syne', sans-serif;
  font-size: 1.05rem;
  letter-spacing: .04em;
  background: linear-gradient(135deg, var(--a), var(--b));
  color: #07111f;
  transition: opacity .2s, transform .1s;
}
button:active  { transform: scale(.98); }
button:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.step {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 14px;
  border-radius: 12px;
  background: rgba(255,255,255,.03);
  border: 1px solid rgba(255,255,255,.08);
  font-family: 'JetBrains Mono', monospace;
  font-size: .82rem;
  margin-top: 10px;
  transition: border-color .3s, background .3s;
}
.dot {
  width: 9px; height: 9px;
  border-radius: 50%;
  background: rgba(255,255,255,.15);
  flex-shrink: 0;
  transition: background .3s, box-shadow .3s;
}
.step.running { border-color: rgba(103,231,255,.3); background: rgba(103,231,255,.05); }
.step.running .dot { background: var(--a); animation: pulse 1s infinite; }
.step.ok  { border-color: rgba(120,239,176,.3); background: rgba(120,239,176,.05); }
.step.ok  .dot { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
.step.err { border-color: rgba(255,139,154,.3); background: rgba(255,139,154,.05); }
.step.err .dot { background: var(--err); box-shadow: 0 0 8px var(--err); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.25} }
.result {
  margin-top: 12px;
  padding: 14px 16px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,.08);
  background: rgba(255,255,255,.03);
  font-family: 'JetBrains Mono', monospace;
  font-size: .78rem;
  line-height: 1.7;
  white-space: pre-wrap;
  word-break: break-all;
  min-height: 54px;
  transition: border-color .3s;
}
.result.ok  { border-color: rgba(120,239,176,.25); color: var(--ok); }
.result.err { border-color: rgba(255,139,154,.25); color: var(--err); }
</style>
</head>
<body>
<div class="wrap"><div class="card">
  <div class="eyebrow">Trafalgar TV</div>
  <h1 class="title">Connexion Xtream</h1>
  <p class="sub">Proxy : trafalgar-proxy1-2.onrender.com</p>

  <div class="field">
    <label>Portail Xtream (URL + port)</label>
    <input id="portal" value="http://sv.tirav.net:8080" inputmode="url" />
  </div>
  <div class="field">
    <label>Username</label>
    <input id="username" value="d3221f05b125" autocomplete="username" />
  </div>
  <div class="field">
    <label>Password</label>
    <input id="password" value="ef0b35ac7125" type="password" autocomplete="current-password" />
  </div>

  <button id="btn" type="button">Se connecter</button>

  <div class="step" id="stepProxy"><div class="dot"></div><span id="stepProxyLabel">1 — Proxy health-check</span></div>
  <div class="step" id="stepAuth"> <div class="dot"></div><span id="stepAuthLabel"> 2 — Auth Xtream</span></div>

  <div class="result" id="result">—</div>
</div></div>

<script>
(function () {
  'use strict';

  const PROXY = 'https://trafalgar-proxy1-2.onrender.com';
  const TIMEOUT = 60000; // 60s car Render free peut mettre ~50s à démarrer

  const $ = id => document.getElementById(id);

  function setStep(id, labelId, state, label) {
    $(id).className = 'step ' + state;
    $(labelId).textContent = label;
  }

  function setResult(text, cls = '') {
    const el = $('result');
    el.textContent = text;
    el.className = 'result ' + cls;
  }

  function safeTrunc(s, max = 600) {
    s = String(s || '');
    return s.length > max ? s.slice(0, max) + '…' : s;
  }

  async function fetchWithTimeout(url, options = {}) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), TIMEOUT);
    try {
      const res = await fetch(url, { ...options, signal: ctrl.signal });
      const text = await res.text();
      return { ok: res.ok, status: res.status, text };
    } finally {
      clearTimeout(timer);
    }
  }

  function fmtErr(e) {
    if (e?.name === 'AbortError') return 'timeout — le proxy met ~50s à démarrer sur Render gratuit, réessaie dans 1 minute';
    return e?.message || 'erreur inconnue';
  }

  async function connect() {
    const portal   = $('portal').value.trim().replace(/\/+$/, '');
    const username = $('username').value.trim();
    const password = $('password').value.trim();

    if (!portal || !username || !password) {
      setResult('Remplis tous les champs.', 'err');
      return;
    }

    $('btn').disabled = true;
    $('btn').textContent = 'Connexion…';
    setStep('stepProxy', 'stepProxyLabel', 'running', '1 — Proxy en cours de démarrage…');
    setStep('stepAuth',  'stepAuthLabel',  '',        '2 — Auth Xtream');
    setResult('Le proxy Render gratuit peut mettre jusqu\'à 50s à démarrer après inactivité…');

    /* ── étape 1 : health-check proxy ── */
    try {
      const h = await fetchWithTimeout(PROXY + '/health');
      if (!h.ok) {
        setStep('stepProxy', 'stepProxyLabel', 'err', '1 — Proxy injoignable (HTTP ' + h.status + ')');
        setResult('Proxy HTTP ' + h.status + '\n' + safeTrunc(h.text), 'err');
        return;
      }
      setStep('stepProxy', 'stepProxyLabel', 'ok', '1 — Proxy OK ✓');
    } catch (e) {
      setStep('stepProxy', 'stepProxyLabel', 'err', '1 — Proxy erreur');
      setResult('Proxy : ' + fmtErr(e), 'err');
      return;
    }

    /* ── étape 2 : auth ── */
    try {
      setStep('stepAuth', 'stepAuthLabel', 'running', '2 — Auth Xtream en cours…');
      const a = await fetchWithTimeout(PROXY + '/xtream/player_api.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ portal, username, password }),
      });

      if (!a.ok) {
        setStep('stepAuth', 'stepAuthLabel', 'err', '2 — Auth échouée (HTTP ' + a.status + ')');
        setResult('Auth HTTP ' + a.status + '\n' + safeTrunc(a.text), 'err');
        return;
      }

      let parsed = null;
      try { parsed = JSON.parse(a.text); } catch (_) {}

      if (parsed?.user_info) {
        const u = parsed.user_info;
        const exp = u.exp_date
          ? new Date(parseInt(u.exp_date) * 1000).toLocaleDateString('fr-FR')
          : '—';
        setStep('stepAuth', 'stepAuthLabel', 'ok', '2 — Connecté ✓');
        setResult(
          '✓ Authentification réussie\n\n' +
          'Utilisateur : ' + (u.username || username) + '\n' +
          'Statut      : ' + (u.status || '—') + '\n' +
          'Expiration  : ' + exp + '\n' +
          'Connexions  : ' + (u.active_cons || 0) + ' / ' + (u.max_connections || '—') + '\n' +
          'Formats     : ' + (u.allowed_output_formats?.join(', ') || '—'),
          'ok'
        );
      } else if (parsed?.user_info === null) {
        setStep('stepAuth', 'stepAuthLabel', 'err', '2 — Identifiants refusés');
        setResult('✗ Identifiants invalides selon le serveur.', 'err');
      } else {
        setStep('stepAuth', 'stepAuthLabel', 'ok', '2 — Réponse reçue ✓');
        setResult('HTTP 200\n\n' + safeTrunc(a.text), 'ok');
      }

    } catch (e) {
      setStep('stepAuth', 'stepAuthLabel', 'err', '2 — Erreur auth');
      setResult('Auth : ' + fmtErr(e), 'err');
    } finally {
      $('btn').disabled = false;
      $('btn').textContent = 'Se connecter';
    }
  }

  $('btn').addEventListener('click', connect);
})();
</script>
</body>
</html>
